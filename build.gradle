plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
}

version = '1.1.0'
group = 'com.arcanealloy.btebackpackbutton'
archivesBaseName = 'beyond-the-end-backpacked-button'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                btebackpackbutton { source sourceSets.main }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.3.0'

    // Backpacked (libs/backpacked-forge-1.19.2-2.1.13.jar) y Quark (libs/Quark-3.4-418.jar): solo se usan sus
    // clases propias (Backpacked, Network, MessageOpenBackpack, BackpackScreen, IQuarkButtonAllowed), así que basta
    // con compilar contra los jars tal cual.
    compileOnly fileTree(dir: 'libs', include: '*.jar')
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'beyond-the-end-backpacked-button',
            'Specification-Vendor'    : 'arcanealloy',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.jar.archiveVersion,
            'Implementation-Vendor'   : 'arcanealloy',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            // Mixin que activa los botones de Quark en la mochila (solo si Quark está instalado)
            'MixinConfigs'            : 'btebackpackbutton.mixins.json'
        ])
    }
}
